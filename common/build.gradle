// Loader-independent core: no Minecraft classes here, so it compiles and is
// unit-tested without downloading the game. The loader modules compile these
// sources into their own jars.

// The core stays on the Java 17 language level: the oldest target, Minecraft 1.20.1,
// runs on Java 17, and every loader jar compiles these sources at its own level.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

dependencies {
    compileOnly "com.google.code.gson:gson:${gson_version}"
    compileOnly "org.slf4j:slf4j-api:${slf4j_version}"

    testImplementation "com.google.code.gson:gson:${gson_version}"
    testImplementation "org.slf4j:slf4j-api:${slf4j_version}"
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

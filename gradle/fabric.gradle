// Fabric, for every Minecraft version. Up to 1.21.11 Minecraft ships obfuscated and Loom
// remaps it with the official names; from 26.1 it ships with those names already.
def obfuscated = rootProject.ext.compareMinecraft(minecraft_version, '26') < 0
apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (obfuscated) {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    } else {
        implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }
}

// -PquickPlay=<world> opens that single player world right away.
if (project.hasProperty('quickPlay')) {
    loom.runs.client.programArgs('--quickPlaySingleplayer', project.property('quickPlay') as String)
}

// Game tests: `gradlew :<minecraft>:fabric:gametest` runs the gametest source set in a headless game
// test server, without a client, and fails when a test fails.
def gametestDir = layout.buildDirectory.dir('gametest')
loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        "${mod_id}-gametest" {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        gametest {
            server()
            name = 'Game Test'
            source sourceSets.gametest
            runDir = 'build/gametest'
            ideConfigGenerated = false
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${gametestDir.get().file('report.xml').asFile}"
        }
    }
}

tasks.named('runGametest') {
    // A fresh world every time, so the tests see what a first start writes.
    doFirst {
        project.delete(gametestDir)
        gametestDir.get().asFile.mkdirs()
        syncCompatMods(gametestDir.get().dir('mods').asFile)
    }
}

tasks.named('runServer') {
    doFirst {
        syncCompatMods(project.file('run/mods'))
    }
}

tasks.register('gametest') {
    group = 'verification'
    description = 'Runs the game tests in a headless server.'
    dependsOn 'runGametest'
}

// NeoForge, 1.21.1 and newer.
apply plugin: 'net.neoforged.moddev'

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            // -PquickPlay=<world> opens that single player world right away.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay') as String)
            }
        }
        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Game tests: `gradlew :<minecraft>:neoforge:gametest` runs the gametest source set in NeoForge's game
// test server, without a client, and fails when a test fails.
def gametestDir = layout.buildDirectory.dir('gametest')
neoForge {
    addModdingDependenciesTo(sourceSets.gametest)
    runs {
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            gameDirectory = gametestDir.get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.gametest
        }
    }
}

tasks.named('runGameTestServer') {
    // A fresh world every time, so the tests see what a first start writes.
    doFirst {
        project.delete(gametestDir)
        gametestDir.get().asFile.mkdirs()
        syncCompatMods(gametestDir.get().dir('mods').asFile)
    }
}

tasks.named('runServer') {
    doFirst {
        syncCompatMods(project.file('run/mods'))
    }
}

tasks.register('gametest') {
    group = 'verification'
    description = 'Runs the game tests in a headless server.'
    dependsOn 'runGameTestServer'
}

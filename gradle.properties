org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Mod
mod_id=worldsure
mod_name=Worldsure
mod_version=0.8.0
mod_group=io.github.kainrav.worldsure
mod_license=MIT
mod_description=Remembers which mods every world was played with. When one is removed or changes version, it warns before the world opens, backs the world up and keeps the removed mod's blocks, mobs and items until it comes back.
# Channel used when publishing: release, beta or alpha
release_type=beta

# Build tools; the Minecraft and loader versions of each target are in versions/<minecraft>/gradle.properties
loom_version=1.18.4
moddev_version=2.0.148
fabric_loader_version=0.19.5
# Oldest Fabric Loader the jars accept
fabric_loader_min=0.15.0

# Libraries bundled with Minecraft, used compile-only by the common module
gson_version=2.10.1
slf4j_version=2.0.7
junit_version=5.11.4

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod
mod_id=worldsure
mod_name=Worldsure
mod_version=0.1.0
mod_group=io.github.kainrav.worldsure
mod_license=MIT
mod_description=Remembers which mods every world was played with. When one is removed or changes version, it warns before the world opens, backs the world up and keeps the removed mod's blocks until it comes back.
# Channel used when publishing: release, beta or alpha
release_type=beta

# Minecraft
minecraft_version=26.3
# First version the jars are not marked compatible with
minecraft_next=26.4
java_version=25

# Fabric, see https://fabricmc.net/develop
loom_version=1.18-SNAPSHOT
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.3

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge
moddev_version=2.0.147
neoforge_version=26.3.0.10-beta

# Libraries bundled with Minecraft, used compile-only by the common module
gson_version=2.11.0
slf4j_version=2.0.16
junit_version=5.11.4

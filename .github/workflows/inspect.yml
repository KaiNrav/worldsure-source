# Temporary: prints Minecraft sources the mod hooks into, for development
# from an environment that cannot download the game. Removed before merge.
name: Inspect

on:
  push:
    branches: [release-0.1.0]
    paths: [.github/workflows/inspect.yml, .github/inspect-classes.txt]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Decompile Minecraft
        run: ./gradlew :fabric:genSources --stacktrace -q || true
      - name: Print classes
        run: |
          SRC=$(realpath "$(find ~/.gradle .gradle fabric/.gradle -name '*sources*.jar' 2>/dev/null | grep -i minecraft-merged | head -1)")
          JAR="${SRC%-sources.jar}.jar"
          echo "SOURCES JAR: $SRC"
          mkdir -p /tmp/src && (cd /tmp/src && unzip -q -o "$SRC")
          while read -r mode cls; do
            [ -z "$cls" ] && continue
            echo "===== BEGIN $mode $cls"
            f="/tmp/src/$(echo "$cls" | tr . /).java"
            if [ "$mode" = src ]; then
              if [ -f "$f" ]; then cat -n "$f"; else echo MISSING; fi
            elif [ "${mode%%:*}" = grep ]; then
              grep -n -C4 -E "${mode#grep:}" "$f" || echo NO MATCH
            else
              javap -p -cp "$JAR" "$cls" || echo MISSING
            fi
            echo "===== END $cls"
          done < "$GITHUB_WORKSPACE/.github/inspect-classes.txt"

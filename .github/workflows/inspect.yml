# Temporary: prints Minecraft sources the mod hooks into, for development
# from an environment that cannot download the game. Removed before merge.
name: Inspect

on:
  push:
    branches: [release-0.1.0]
    paths: [.github/workflows/inspect.yml, .github/inspect-classes.txt]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Decompile Minecraft
        run: ./gradlew :fabric:genSources --stacktrace -q || true
      - name: Print classes
        run: |
          SRC=$(find ~/.gradle fabric/.gradle .gradle -name '*sources*.jar' 2>/dev/null | grep -i minecraft | head -1)
          echo "SOURCES JAR: $SRC"
          mkdir -p /tmp/src && cd /tmp/src && unzip -q -o "$SRC"
          while read -r cls; do
            [ -z "$cls" ] && continue
            f="/tmp/src/$(echo "$cls" | tr . /).java"
            echo "===== BEGIN $cls"
            if [ -f "$f" ]; then cat -n "$f"; else echo "MISSING"; ls "$(dirname "$f")" | head -50; fi
            echo "===== END $cls"
          done < "$GITHUB_WORKSPACE/.github/inspect-classes.txt"

name: Build

on:
  push:
    branches: [main]
    # A version tag is tested here; the Daily release workflow only releases tags that passed.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17 for 1.20.1, 21 for 1.21.x, 25 for 26.x and for Gradle itself (the last one is the default)
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build every jar
        run: ./gradlew build --stacktrace
      - name: Check the release jars
        run: |
          set -e
          jars=$(ls versions/*/*/build/libs/worldsure-*.jar | grep -vE -- '-(sources|dev|slim|all)\.jar$')
          echo "$jars"
          test "$(echo "$jars" | wc -l)" -eq 12
          for jar in $jars; do
            unzip -l "$jar" | grep -q assets/worldsure/icon.png
            unzip -l "$jar" | grep -q LICENSE_worldsure
            # Game tests are a separate source set and must stay out of the jars.
            # (`! cmd` never stops a `set -e` script, so failures exit explicitly.)
            if unzip -l "$jar" | grep -qiE 'gametest|structures?/empty\.nbt'; then
              echo "$jar contains game tests" >&2
              exit 1
            fi
            for meta in fabric.mod.json META-INF/neoforge.mods.toml META-INF/mods.toml worldsure.mixins.json; do
              if unzip -l "$jar" | grep -q " $meta$" && unzip -p "$jar" "$meta" | grep -F '${'; then
                echo "$jar has an unexpanded placeholder in $meta" >&2
                exit 1
              fi
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: worldsure-jars
          path: versions/*/*/build/libs/*.jar

  smoke:
    # Per target: the game tests in a game test server, then a real dedicated server for the
    # passport, backup and placeholder round trip.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - 26.3:fabric
          - 26.3:neoforge
          - 26.2:fabric
          - 26.2:neoforge
          - 26.1.2:fabric
          - 26.1.2:neoforge
          - 1.21.11:fabric
          - 1.21.11:neoforge
          - 1.21.1:fabric
          - 1.21.1:neoforge
          - 1.20.1:fabric
          - 1.20.1:forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Game tests
        timeout-minutes: 30
        run: |
          target='${{ matrix.target }}'
          ./gradlew ":${target%%:*}:${target##*:}:gametest" "-Ptargets=${target%%:*}" --console=plain
      - name: Server smoke test
        timeout-minutes: 30
        run: python3 .github/smoke/smoke.py ${{ matrix.target }}
      - name: Name the logs
        if: always()
        run: echo "LOGS=smoke-$(echo '${{ matrix.target }}' | tr ':' '-')-logs" >> "$GITHUB_ENV"
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LOGS }}
          path: |
            versions/*/*/run/logs/
            versions/*/*/build/gametest/logs/
            versions/*/*/build/gametest/report.xml

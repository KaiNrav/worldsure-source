plugins {
    id 'net.neoforged.moddev' version "${moddev_version}"
}

def common = project(':common')

sourceSets.main {
    java.srcDir common.file('src/main/java')
    resources.srcDir common.file('src/main/resources')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    def props = [
            version          : mod_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_description  : mod_description,
            mod_license      : mod_license,
            minecraft_version: minecraft_version,
            neoforge_version : neoforge_version,
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/KaiNrav/worldsure-source/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
iconFile = "assets/worldsure/icon.png"
displayURL = "https://github.com/KaiNrav/worldsure-source"
authors = "KaiNrav"
description = '''${mod_description}'''

[[mixins]]
config = "worldsure.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},${minecraft_next})"
ordering = "NONE"
side = "BOTH"
